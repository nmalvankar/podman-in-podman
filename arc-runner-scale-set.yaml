apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: podman-runner-scale-set
  namespace: actions-runner-system  # Adjust to your ARC namespace
spec:
  # GitHub scope for this runner scale set.
  # Repository example: https://github.com/your-org/your-repo
  # Organization example: https://github.com/your-org
  githubConfigUrl: https://github.com/your-org/your-repo
  # Secret containing GitHub auth for ARC (GitHub App or PAT).
  # Create this secret per ARC documentation.
  githubConfigSecret: github-config-secret

  maxRunners: 10
  minRunners: 1
  
  # Runner pod template
  template:
    spec:
      volumes:
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
        - name: podman-storage
          emptyDir: {}
          # For persistent storage across pod restarts, use:
          # persistentVolumeClaim:
          #   claimName: podman-storage-pvc
      
      volumeMounts:
      containers:
        - name: runner
          # Use your built image
          image: your-registry/github-actions-runner:latest

          # Required for Podman-in-Podman
          securityContext:
            privileged: true
            runAsUser: 0

          volumeMounts:
            - name: dev-fuse
              mountPath: /dev/fuse
            - name: podman-storage
              mountPath: /home/runner/.local/share/containers

          # Labels for workflow runner selection
          env:
            - name: RUNNER_LABELS
              value: podman,linux,self-hosted
            - name: PODMAN_USERNS
              value: "keep-id"
            - name: _CONTAINERS_USERNS_CONFIGURED
              value: "true"
            - name: _CONTAINERS_ROOTLESS_UID
              value: "0"
            - name: _CONTAINERS_ROOTLESS_GID
              value: "0"
